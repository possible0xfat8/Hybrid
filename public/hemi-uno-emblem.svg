<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Solid Orange Semicircle with angled cut -->
  <path d="M 91 15 A 85 85 0 1 0 101 185 L 91 15 Z" fill="#FF4600" />

  <!-- Right Solid Orange Semicircle with angled cut -->
  <path d="M 103 15 A 85 85 0 1 1 113 185 L 103 15 Z" fill="#FF4600" />

  <!-- 3 Center Playing Cards matching Hemi Uno official logo -->
  <!-- Card 1 (Back left - White with dark border) -->
  <g transform="translate(86, 100) rotate(-22)">
    <rect x="-20" y="-31" width="40" height="62" rx="5" ry="5" fill="#FFFFFF" stroke="#111318" stroke-width="2.2" filter="url(#cardShadow)"/>
  </g>

  <!-- Card 2 (Middle - White with dark border) -->
  <g transform="translate(94, 100) rotate(-10)">
    <rect x="-20" y="-31" width="40" height="62" rx="5" ry="5" fill="#FFFFFF" stroke="#111318" stroke-width="2.2" filter="url(#cardShadow)"/>
  </g>

  <!-- Card 3 (Front right - Black with white border & Hemi Orange diamond) -->
  <g transform="translate(105, 100) rotate(10)">
    <rect x="-20" y="-31" width="40" height="62" rx="5" ry="5" fill="#11141A" stroke="#FFFFFF" stroke-width="3" filter="url(#cardShadow)"/>
    <polygon points="0,-9.5 7.5,0 0,9.5 -7.5,0" fill="#FF4600"/>
  </g>
</svg>
