<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <filter id="emblemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="embOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF4600"/>
    </linearGradient>
    <linearGradient id="embGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="embBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4600"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Left Solid Orange Semicircle with angled cut -->
  <path d="M 91 15 A 85 85 0 1 0 101 185 L 91 15 Z" fill="#FF4600" />

  <!-- Right Solid Orange Semicircle with angled cut -->
  <path d="M 103 15 A 85 85 0 1 1 113 185 L 103 15 Z" fill="#FF4600" />

  <!-- 4 Diagonal Interconnected Discs -->
  <line x1="68" y1="132" x2="134" y2="68" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" filter="url(#emblemGlow)"/>
  <line x1="68" y1="132" x2="134" y2="68" stroke="url(#embBeam)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Disc 1 -->
  <circle cx="68" cy="132" r="14" fill="#0E1217" stroke="#FFFFFF" stroke-width="3" filter="url(#emblemGlow)"/>
  <circle cx="68" cy="132" r="8" fill="url(#embOrange)"/>

  <!-- Disc 2 -->
  <circle cx="90" cy="110" r="14" fill="#0E1217" stroke="#FFFFFF" stroke-width="3" filter="url(#emblemGlow)"/>
  <circle cx="90" cy="110" r="8" fill="url(#embGold)"/>

  <!-- Disc 3 -->
  <circle cx="112" cy="88" r="14" fill="#0E1217" stroke="#FFFFFF" stroke-width="3" filter="url(#emblemGlow)"/>
  <circle cx="112" cy="88" r="8" fill="url(#embOrange)"/>

  <!-- Disc 4 -->
  <circle cx="134" cy="66" r="15" fill="#FF4600" stroke="#FFFFFF" stroke-width="3.5" filter="url(#emblemGlow)"/>
  <circle cx="134" cy="66" r="8" fill="#FFFFFF"/>
</svg>
